<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - EPLS</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <span>EPLS Portal</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html" class="admin-only">Dashboard</a></li>
            <li><a href="employees.html" class="active admin-only">Employees</a></li>
            <li><a href="departments.html" class="admin-only">Departments</a></li>
            <li><a href="attendance.html">Attendance</a></li>
            <li><a href="leaves.html">Leaves</a></li>
            <li><a href="payroll.html">Payroll</a></li>
            <li><a href="profile.html">My Profile</a></li>
            <li><a href="#" id="logout-btn">Logout</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <nav class="top-nav">
            <h2>Employees</h2>
            <div class="user-info">
                <span id="sidebar-user-name">User Name</span>
                <span class="user-role-badge" id="sidebar-user-role">ROLE</span>
            </div>
        </nav>

        <div class="content-area">
            <div class="table-container">
                <div class="table-header-actions">
                    <h3>All Employees</h3>
                    <button class="btn btn-primary" onclick="openEmpModal()">+ Add Employee</button>
                </div>
                
                <div id="loading" class="text-center mt-3 mb-3">Loading employees...</div>
                
                <table id="empTable" class="hidden">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Designation</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="empTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div class="modal" id="empModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add Employee</h3>
            <button class="close-modal" onclick="closeEmpModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="empForm">
                <input type="hidden" id="empId">
                <div class="form-group" id="userIdGroup">
                    <label class="form-label">User ID (Link to User Account)</label>
                    <input type="number" id="empUserId" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Employee Code</label>
                    <input type="text" id="empCode" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="empName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="empEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" id="empPhone" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Department</label>
                    <select id="empDept" class="form-control" required>
                        <option value="">Select Department...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Designation</label>
                    <input type="text" id="empDesignation" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Basic Salary</label>
                    <input type="number" step="0.01" id="empSalary" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Joining Date</label>
                    <input type="date" id="empJoining" class="form-control" required>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeEmpModal()">Cancel</button>
            <button class="btn btn-primary" id="saveEmpBtn" onclick="saveEmployee()">Save</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/employees.js"></script>
</body>
</html>
