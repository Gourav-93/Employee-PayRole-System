<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EPLS</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">
        <h2 class="text-center mb-3">Login to EPLS</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" required placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%" id="loginBtn">Login</button>
            
            <p class="text-center mt-3">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        
        try {
            btn.textContent = 'Logging in...';
            btn.disabled = true;
            
            await auth.login(email, password);
            showToast('Login successful!');
            
            setTimeout(() => {
                auth.redirectByRole();
            }, 1000);
            
        } catch (error) {
            showToast(error.message, 'error');
            btn.textContent = 'Login';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
