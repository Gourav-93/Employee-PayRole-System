<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HRMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-card {
            flex: 1;
            padding: 15px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .role-card.selected {
            border-color: var(--primary);
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }
        .section-title {
            margin-top: 20px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-box" style="max-width: 600px; width: 100%;">
        <h2 class="text-center mb-3">System Registration</h2>
        
        <div class="text-center mb-2">Select Account Type</div>
        <div class="role-selector" id="roleSelector">
            <div class="role-card selected" data-role="EMPLOYEE">Employee</div>
            <div class="role-card" data-role="HR">HR</div>
            <div class="role-card" data-role="ADMIN">Admin</div>
        </div>

        <form id="registerForm">
            <input type="hidden" id="role" value="EMPLOYEE">
            
            <h4 class="section-title">Account Details</h4>
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" class="form-control" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" required placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Create a password">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" required placeholder="Confirm your password">
            </div>

            <div id="employeeOnboardingFields">
                <h4 class="section-title">Personal Details</h4>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="text" id="phone" class="form-control" placeholder="Enter phone number">
                </div>

                <h4 class="section-title">Employment Details</h4>
                <div class="form-group">
                    <label class="form-label" for="empCode">Employee Code</label>
                    <input type="text" id="empCode" class="form-control" placeholder="E.g. EMP-001">
                </div>

                <div class="form-group">
                    <label class="form-label" for="departmentId">Department</label>
                    <select id="departmentId" class="form-control">
                        <option value="">Select Department...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="designation">Designation</label>
                    <input type="text" id="designation" class="form-control" placeholder="E.g. Software Engineer">
                </div>

                <div class="form-group">
                    <label class="form-label" for="joiningDate">Joining Date</label>
                    <input type="date" id="joiningDate" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label" for="basicSalary">Basic Salary</label>
                    <input type="number" step="0.01" id="basicSalary" class="form-control" placeholder="0.00">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary mt-2" style="width: 100%" id="registerBtn">Create Account</button>
            
            <p class="text-center mt-3">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Load Departments for Employee Registration
        try {
            const depts = await api.get('/Department');
            const select = document.getElementById('departmentId');
            depts.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name;
                select.appendChild(opt);
            });
        } catch (e) {
            console.warn("Could not load departments", e);
        }

        // Role Selection Logic
        const roleCards = document.querySelectorAll('.role-card');
        const roleInput = document.getElementById('role');
        const empFields = document.getElementById('employeeOnboardingFields');
        const empInputs = empFields.querySelectorAll('input, select');

        roleCards.forEach(card => {
            card.addEventListener('click', () => {
                roleCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                
                const selectedRole = card.getAttribute('data-role');
                roleInput.value = selectedRole;

                if (selectedRole === 'EMPLOYEE') {
                    empFields.style.display = 'block';
                    empInputs.forEach(input => input.setAttribute('required', 'required'));
                    document.getElementById('phone').removeAttribute('required'); // phone is optional
                } else {
                    empFields.style.display = 'none';
                    empInputs.forEach(input => input.removeAttribute('required'));
                }
            });
        });

        // Form Submit
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showToast("Passwords do not match", "error");
                return;
            }

            const btn = document.getElementById('registerBtn');
            const role = roleInput.value;
            
            try {
                btn.textContent = 'Registering...';
                btn.disabled = true;
                
                const payload = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    password: password,
                    role: role
                };

                if (role === 'EMPLOYEE') {
                    const deptVal = document.getElementById('departmentId').value;
                    if (!deptVal) {
                        showToast("Please select a Department. (If list is empty, HR must create one first)", "error");
                        btn.textContent = 'Create Account';
                        btn.disabled = false;
                        return;
                    }
                    
                    payload.phone = document.getElementById('phone').value;
                    payload.employeeCode = document.getElementById('empCode').value;
                    payload.departmentId = parseInt(deptVal);
                    payload.designation = document.getElementById('designation').value;
                    payload.joiningDate = document.getElementById('joiningDate').value;
                    payload.basicSalary = parseFloat(document.getElementById('basicSalary').value || 0);
                    
                    await auth.registerEmployee(payload);
                } else {
                    await auth.register(payload.name, payload.email, payload.password, payload.role);
                }
                
                showToast('Registration successful! Please login.');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                showToast(error.message, 'error');
                btn.textContent = 'Create Account';
                btn.disabled = false;
            }
        });
    });
</script>

</body>
</html>
